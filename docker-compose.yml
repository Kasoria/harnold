# Harnold im Server-Betrieb. Start: cp .env.example .env, Token setzen, dann `docker compose up -d --build`.
services:
  harnold:
    # Fertiges Image aus der GitHub Container Registry. Mit `--build` wird stattdessen lokal gebaut (z. B. für HARNOLD_APT_PACKAGES).
    image: ghcr.io/kasoria/harnold:${HARNOLD_VERSION:-latest}
    pull_policy: missing
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    build:
      context: .
      args:
        HARNOLD_APT_PACKAGES: ${HARNOLD_APT_PACKAGES:-}
    shm_size: 1gb # Chromium/Playwright
    restart: unless-stopped
    environment:
      HARNOLD_TOKEN: ${HARNOLD_TOKEN:?HARNOLD_TOKEN in .env setzen}
      # Optional: API-Key statt Claude-Abo-Login
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Update-Knopf in der UI: spricht den Watchtower-Dienst (nur im Compose-Netz erreichbar).
      HARNOLD_UPDATER_URL: http://watchtower:8080
      HARNOLD_UPDATER_TOKEN: ${HARNOLD_TOKEN}
    volumes:
      - harnold-data:/data
      - harnold-home:/home/harnold
    # Nur lokal gebunden; öffentlich erreichbar über Caddy (Profil "proxy") oder Tailscale/Tunnel.
    ports:
      - "127.0.0.1:${HARNOLD_PORT:-4317}:4317"

  # Update-Dienst: holt auf Knopfdruck in der UI (oder nachts, mit HARNOLD_AUTO_UPDATE=true) das neue Image und startet Harnold neu.
  # Nur er hat Docker-Zugriff, nicht Harnold. Er fasst nur Container mit dem Label oben an.
  # Laufende Agent-Sitzungen werden beim Neustart unterbrochen.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${HARNOLD_TOKEN}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: ${HARNOLD_AUTO_UPDATE:-false}
      WATCHTOWER_SCHEDULE: ${HARNOLD_UPDATE_SCHEDULE:-0 17 3 * * *}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    profiles: ["proxy"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [harnold]
    environment:
      HARNOLD_DOMAIN: ${HARNOLD_DOMAIN:-localhost}
    command: caddy reverse-proxy --from ${HARNOLD_DOMAIN:-localhost} --to harnold:4317
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

volumes:
  harnold-data:
  harnold-home:
  caddy-data:
